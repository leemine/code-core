name: Testctl stable regression

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '50 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.5'
      - name: Install network isolation runner
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install locked test dependencies
        run: uv sync --locked --group test --extra cli --extra observability --python 3.13
      - name: Verify orchestrator
        run: python3 -m unittest tools.tests.test_testctl tools.tests.test_regression_manifest -v
      - name: Run stable regression
        env:
          TESTCTL_RETENTION_DAYS: ${{ github.event_name == 'schedule' && '90' || '30' }}
          TESTCTL_NETWORK_MODE: strict
          TESTCTL_BWRAP_SUDO: '1'
        run: python3 tools/testctl.py run --profile pr-stable
      - name: Verify PersonalContext host authority
        env:
          HOME: ${{ runner.temp }}/personal-context-home
          XDG_CACHE_HOME: ${{ runner.temp }}/personal-context-cache
          TMPDIR: ${{ runner.temp }}/personal-context-tmp
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$TMPDIR"
          # The preceding sudo/bubblewrap run can own repository-relative logs.
          # Keep this non-root step's logs and temporary files in its own cwd.
          cd "$TMPDIR"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest --override-ini addopts='' --timeout=45 -q \
            "$GITHUB_WORKSPACE/tests/unit_tests/harness/personal_context/test_host_execution_authority.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/harness/personal_context/test_closed_class_inventory.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/harness/personal_context/test_balanced_two_stage.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/core/context_engine/test_round_level_compressor.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/core/foundation/llm/test_model_request_authority.py"
      - name: Verify RSI repair filesystem isolation
        env:
          HOME: ${{ runner.temp }}/rsi-repair-home
          XDG_CACHE_HOME: ${{ runner.temp }}/rsi-repair-cache
          TMPDIR: ${{ runner.temp }}/rsi-repair-tmp
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$TMPDIR"
          cd "$TMPDIR"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest --override-ini addopts='' --timeout=30 -q \
            "$GITHUB_WORKSPACE/tests/unit_tests/rsi/test_verification_repair_tools.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/rsi/test_prompt_manifest_authoring.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/rsi/test_member_semantic_authoring.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/rsi/test_member_optimizer.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/rsi/test_single_harness_iterative.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/rsi/test_checkpoint_plugin_manifest.py" \
            "$GITHUB_WORKSPACE/tests/unit_tests/rsi/test_plugin_manifest.py"
      - name: Upload test archive
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-core-testctl-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-runs/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  full-python:
    # Full Python regression is a daily audit, not a per-commit gate.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.5'
      - name: Install full Python environment
        run: uv sync --locked --group test --extra cli --extra pulsar --extra sandbox --extra online-rl --extra observability --extra chromadb --extra pgvector --python 3.13
      - name: Verify full-run accounting
        run: python3 -m unittest tools.tests.test_full_shards -v
      - name: Run full Python regression
        env:
          FULL_PYTHON_WORKERS: '4'
        run: .venv/bin/python tools/full_regression.py --workers "$FULL_PYTHON_WORKERS"
      - name: Upload full Python archive
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-core-full-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-runs/full-python-*/
          if-no-files-found: error
          retention-days: 90
