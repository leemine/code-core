name: Testctl stable regression

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '50 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.5'
      - name: Install network isolation runner
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install locked test dependencies
        run: uv sync --locked --group test --extra cli --python 3.13
      - name: Verify orchestrator
        run: python3 -m unittest tools.tests.test_testctl tools.tests.test_regression_manifest -v
      - name: Run stable regression
        env:
          TESTCTL_RETENTION_DAYS: ${{ github.event_name == 'schedule' && '90' || '30' }}
          TESTCTL_NETWORK_MODE: strict
          TESTCTL_BWRAP_SUDO: '1'
        run: python3 tools/testctl.py run --profile pr-stable
      - name: Upload test archive
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-core-testctl-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-runs/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  full-python:
    # Full Python regression is a daily audit, not a per-commit gate.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.5'
      - name: Install full Python environment
        run: uv sync --locked --group test --extra cli --extra pulsar --extra sandbox --extra online-rl --extra observability --extra chromadb --extra pgvector --python 3.13
      - name: Verify full-run accounting
        run: python3 -m unittest tools.tests.test_full_shards -v
      - name: Run full Python regression
        env:
          FULL_PYTHON_WORKERS: '4'
        run: .venv/bin/python tools/full_regression.py --workers "$FULL_PYTHON_WORKERS"
      - name: Upload full Python archive
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-core-full-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-runs/full-python-*/
          if-no-files-found: error
          retention-days: 90
